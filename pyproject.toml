[project]
name = "hermes-memory-layer"
version = "0.1.0"
description = "Hermes Agent memory layer — Agent Platform Sessions + Memory Bank + BigQuery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-aiplatform>=1.90.0",
    "google-cloud-bigquery>=3.25.0",
    "google-genai>=0.3.0",
    "pydantic>=2.0",
    "click>=8.1",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
adk = ["google-adk>=0.3.0"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
hermes-memory = "hermes_memory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_memory"]

[tool.ruff]
line-length = 100
target-version = "py311"
